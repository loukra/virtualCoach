# Backend for your own server. Put a TLS-terminating reverse proxy (Caddy, nginx) in front:
# the app sends its Supabase access token with every request, so plain HTTP must not leave the host.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
